<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title description">
  <title id="title">Perfil gráfico de Orlando Huapaya</title>
  <desc id="description">Imagen de respaldo con iniciales y estética tecnológica.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111523"/>
      <stop offset="0.55" stop-color="#0d0d18"/>
      <stop offset="1" stop-color="#160d2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d2ff"/>
      <stop offset="1" stop-color="#9d4edd"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#00d2ff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#9d4edd" stop-opacity=".12"/>
      <stop offset="1" stop-color="#9d4edd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="720" height="720" rx="64" fill="url(#background)"/>
  <rect width="720" height="720" rx="64" fill="url(#grid)"/>
  <circle cx="360" cy="350" r="310" fill="url(#halo)"/>
  <circle cx="180" cy="180" r="92" fill="#00d2ff" opacity=".11" filter="url(#blur)"/>
  <circle cx="560" cy="560" r="120" fill="#9d4edd" opacity=".13" filter="url(#blur)"/>
  <circle cx="360" cy="350" r="212" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8 18" opacity=".75"/>
  <circle cx="360" cy="350" r="171" fill="#0b0b14" stroke="#fff" stroke-opacity=".09" stroke-width="2"/>
  <text x="360" y="375" text-anchor="middle" fill="url(#accent)" font-family="Arial, sans-serif" font-size="132" font-weight="700" letter-spacing="-8">OH</text>
  <text x="360" y="430" text-anchor="middle" fill="#f7f7fb" fill-opacity=".66" font-family="monospace" font-size="24" letter-spacing="6">&lt;/&gt;</text>
  <path d="M274 502h172" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
</svg>
